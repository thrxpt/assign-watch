name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip submission and release)"
        required: false
        default: false
        type: boolean
      chrome:
        description: "Submit to Chrome Web Store"
        required: false
        default: true
        type: boolean
      firefox:
        description: "Submit to Firefox Add-ons"
        required: false
        default: true
        type: boolean
      github_release:
        description: "Create GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node
          cache: true
          require-lockfile: true

      - name: Read and verify version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "Tag ${REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package browser archives
        run: |
          pnpm zip
          pnpm zip:firefox
          pnpm zip:safari

      - name: Verify archives exist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for suffix in chrome firefox safari sources; do
            archive=".output/assign-watch-${VERSION}-${suffix}.zip"
            if [ ! -f "$archive" ]; then
              echo "Expected release archive not found: ${archive}" >&2
              exit 1
            fi
          done

      - name: Upload release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: .output/assign-watch-${{ steps.meta.outputs.version }}-*.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  submit-chrome:
    needs: package
    if: github.event_name == 'push' || inputs.chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node
          cache: true
          require-lockfile: true

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: .output

      - name: Submit to Chrome
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          VERSION: ${{ needs.package.outputs.version }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          args=(--chrome-zip ".output/assign-watch-${VERSION}-chrome.zip")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          pnpm wxt submit "${args[@]}"

  submit-firefox:
    needs: package
    if: github.event_name == 'push' || inputs.firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node
          cache: true
          require-lockfile: true

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: .output

      - name: Submit to Firefox
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          VERSION: ${{ needs.package.outputs.version }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          args=(
            --firefox-zip ".output/assign-watch-${VERSION}-firefox.zip"
            --firefox-sources-zip ".output/assign-watch-${VERSION}-sources.zip"
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          pnpm wxt submit "${args[@]}"

  github-release:
    needs: package
    if: github.event_name == 'push' || inputs.github_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node
          cache: true
          require-lockfile: true

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: .output

      - name: Upload to GitHub Release
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          VERSION: ${{ needs.package.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=".output/assign-watch-${VERSION}-chrome.zip,.output/assign-watch-${VERSION}-firefox.zip,.output/assign-watch-${VERSION}-safari.zip"
          args=(--assets "$assets")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry)
          fi
          pnpm exec changelogithub "${args[@]}"
