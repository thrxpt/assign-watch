name: Bug report
description: Report a problem with Assign Watch
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reliably reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your browser and version, operating system, and Assign Watch version.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots or other helpful details. Remove personal information from screenshots first.
    validations:
      required: false
