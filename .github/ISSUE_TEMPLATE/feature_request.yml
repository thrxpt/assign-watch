name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What would you like to do that is currently difficult or missing?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Assign Watch to work.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots or other details that help explain the request.
    validations:
      required: false
