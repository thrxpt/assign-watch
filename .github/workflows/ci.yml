name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint and formatting
        run: pnpm check

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build Chrome
        run: pnpm build

      - name: Build Firefox
        run: pnpm build:firefox

      - name: Build Safari
        run: pnpm build:safari
